# =====================================
# 基础配置
# =====================================

mixed-port: 7890
socks-port: 7891

allow-lan: false
mode: rule
ipv6: false
log-level: info

external-controller: 127.0.0.1:9090

unified-delay: true
tcp-concurrent: true
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

# =====================================
# TUN 模式
# =====================================

tun:
  enable: true

  # 需要支持 mips 的 Mihomo 内核
  # 旧版内核可先沿用现有协议栈
  stack: mips

  auto-route: true
  auto-detect-interface: true

  # 劫持普通 UDP/TCP DNS 查询
  dns-hijack:
    - "any:53"
    - "tcp://any:53"

  # Windows 多宿主 DNS 泄漏防护
  strict-route: true

# =====================================
# DNS 配置
# =====================================

dns:
  enable: true
  ipv6: false
  prefer-h3: false

  # TUN 下不强制额外监听本机 53 端口
  # 如需本机独立 DNS 服务，可自行开启
  # listen: 127.0.0.1:1053

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # DNS 出站遵循路由规则
  respect-rules: true

  # 用于 DNS 服务器域名的初始解析
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 代理节点本身的域名解析
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 默认 DNS：国内 DoH
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 国外域名的 DNS 解析策略
  nameserver-policy:
    "geosite:geolocation-!cn":
      - "https://1.1.1.1/dns-query#RULES"

  # DIRECT 出站重新解析域名
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # Fake-IP 过滤
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    # 局域网及本地域名
    - "*.lan"
    - "*.local"
    - "*.home.arpa"

    # Windows 网络连通性检测
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"

    # 游戏和实时通信
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "*.xboxlive.com"
    - "*.teafone.com"
    - "*.sktswe.net"
    - "rtc.goodfone.co.kr"
    - "*.chattti.com"

# 用于配置链式代理的落地节点
{% if request.landing_url != "" %}
proxy-providers:
  ChainEndpoint:
    type: http
    url: {{ request.landing_url}}
    interval: 86400
    override:
      dialer-proxy: 🇺🇲 美国节点
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600
{% endif %}
