[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则
;clash_meta规则集，使用一些meta的rule set
;路由器上使用的规则集，路由器性能差，需要支持的设备连接多，所有规则简单一点。主要目的：网页

;增强中国IP段：支持
;增强国外GFW：支持
;支持局域网设备切换 是否使用代理

