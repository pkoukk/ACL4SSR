[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则
;clash_meta规则集，使用一些meta的rule set
;终端上使用的规则，最细

;去广告：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持

;设置规则标志位
; ==================== 0. 局域网与下载防漏 ====================
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,PRIVATE,no-resolve
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
ruleset=DIRECT,https://raw.githubusercontent.com/pkoukk/ACL4SSR/pkoukk/Clash/StaffNet.list

; ==================== 1. 广告拦截 ====================
ruleset=广告拦截,[]GEOSITE,ads

; ==================== 2. 游戏专区分流 ====================
ruleset=DIRECT,[]GEOSITE,steam@cn
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamRegionCheck.list
ruleset=外服游戏,https://raw.githubusercontent.com/pkoukk/ACL4SSR/pkoukk/Clash/GameProcess.list
ruleset=游戏平台,[]GEOSITE,steam
ruleset=游戏平台,[]GEOSITE,epicgames
ruleset=游戏平台,[]GEOSITE,ea
ruleset=游戏平台,[]GEOSITE,playstation
ruleset=游戏平台,[]GEOSITE,nintendo
ruleset=游戏平台,[]GEOSITE,blizzard

; ==================== 3. 频繁变动的专属服务 ====================
ruleset=AI网站,https://raw.githubusercontent.com/pkoukk/ACL4SSR/pkoukk/Clash/Ruleset/AI.list

; ==================== 4. 国际大厂服务 ====================
ruleset=谷歌FCM,[]GEOSITE,googlefcm
ruleset=谷歌FCM,[]GEOSITE,google
ruleset=微软服务,[]GEOSITE,onedrive
ruleset=微软服务,[]GEOSITE,microsoft
ruleset=苹果服务,[]GEOSITE,apple
ruleset=全球直连,[]GEOSITE,netease

; ==================== 5. 社交与流媒体 ====================
ruleset=电报消息,[]GEOSITE,telegram
ruleset=电报消息,[]GEOIP,telegram

; ==================== 6. 其它国外网站兜底 ====================
ruleset=国外网站,[]GEOSITE,proxy
ruleset=国外网站,[]GEOSITE,media
ruleset=国外网站,[]GEOIP,media

; ==================== 7. 国内直连白名单 ====================
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,CN

; ==================== 8. 漏网之鱼 ====================
ruleset=漏网之鱼,[]MATCH


;设置分组标志位
custom_proxy_group=代理节点`select`.*

custom_proxy_group=广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=外服游戏`select`[]代理节点`[]DIRECT
custom_proxy_group=游戏平台`select`[]DIRECT`[]代理节点
custom_proxy_group=AI网站`select`[]代理节点`[]DIRECT
custom_proxy_group=谷歌FCM`select`[]代理节点`[]DIRECT
custom_proxy_group=微软服务`select`[]DIRECT`[]代理节点
custom_proxy_group=苹果服务`select`[]DIRECT`[]代理节点
custom_proxy_group=电报消息`select`[]代理节点`[]DIRECT
custom_proxy_group=国外网站`select`[]代理节点`[]DIRECT

custom_proxy_group=全球直连`select`[]DIRECT`[]代理节点
custom_proxy_group=全球直连`select`[]DIRECT`[]REJECT`[]代理节点
custom_proxy_group=漏网之鱼`select`[]代理节点`[]DIRECT`[]美国自建
custom_proxy_group=美国自建`select`(美国自建)
;设置分组标志位

enable_rule_generator=true
overwrite_original_rules=true

clash_rule_base=https://raw.githubusercontent.com/pkoukk/ACL4SSR/pkoukk/Clash/pkoukk_pc.yml

;luck
