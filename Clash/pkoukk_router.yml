# =====================================
# 基础配置
# =====================================

mixed-port: 7890
socks-port: 7891

allow-lan: true
mode: rule
ipv6: false
log-level: info

external-controller: 127.0.0.1:9090

unified-delay: true
tcp-concurrent: true
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip

  # 0. 用于解析下面所有带域名的 DOH 的 DNS
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5

  # 1. 明确国内域名、apple，走阿里/腾讯
  nameserver-policy:
    "geosite:cn,private":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query

  # 2. 全局默认 DNS 换成国外，并加上 #RULES 强制走代理（分流规则），由于 1.1.1.1 不匹配任何规则，会走到 MATCH，从而让远程节点服务器进行 DNS 解析
  nameserver:
    - "https://1.1.1.1/dns-query#RULES"
    - "https://8.8.8.8/dns-query#RULES"

  # 3. 用于解析节点的域名的 DNS
  proxy-server-nameserver:
    - 119.29.29.29
    - 223.5.5.5

  # 4. 解析到最后发现是直连则走此 DNS
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 在 direct-nameserver 存在时，依然以 nameserver-policy 优先
  direct-nameserver-follow-policy: true

  fake-ip-range: 198.18.0.0/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "+.market.xiaomi.com"
    - "localhost.ptlogin2.qq.com"
    - "*.msftncsi.com"
    - "www.msftconnecttest.com"
    - "geosite:nexon"

tun:
  enable: true
  stack: mips
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack: ['any:53', 'tcp://any:53']